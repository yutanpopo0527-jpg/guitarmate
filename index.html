    <!-- ICOファイルを使う場合 (推奨) -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.8); }
        body { background-color: #0f172a; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #f59e0b; margin-top: -4px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #475569; border-radius: 4px; }
        .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
        /* Layered Canvas */
        .waveform-container { position: relative; width: 100%; height: 100%; }
        .waveform-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        /* LED Tuner Styles */
        .led-bar { transition: all 0.1s ease; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .led-active-green { background-color: #10b981; box-shadow: 0 0 10px #10b981, 0 0 20px #10b981; }
        .led-active-red { background-color: #ef4444; box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444; }
        .led-inactive { background-color: #334155; opacity: 0.3; }
        /* YouTube Embed */
        .youtube-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; background: #000; border-radius: 0.5rem;}
        .youtube-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>

        const IconSettings = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>);

        const IconList = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>);
        const IconRewind = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>);
        const IconForward = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m13 17 5-5-5-5"/><path d="m6 17 5-5-5-5"/></svg>);
        const IconRepeat = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>);
        const IconDownload = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>);

        const IconLayers = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>);
        const IconTimer = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>);
        const IconFileText = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>);

        // --- Audio Logic (Metronome) ---
        const createNoiseBuffer = (ctx) => {
            const bufferSize = ctx.sampleRate * 2; 
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            return buffer;
        };
        const playKick = (ctx, time, mixNode) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); if(mixNode) gain.connect(mixNode);
            osc.frequency.setValueAtTime(100, time); osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.3); gain.gain.setValueAtTime(1.0, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3); osc.start(time); osc.stop(time + 0.3);
        };
        const playSnare = (ctx, time, noiseBuffer, mixNode) => {
            const osc = ctx.createOscillator(); const oscGain = ctx.createGain(); osc.type = 'triangle'; osc.connect(oscGain); oscGain.connect(ctx.destination); if(mixNode) oscGain.connect(mixNode);
            osc.frequency.setValueAtTime(200, time); oscGain.gain.setValueAtTime(0.3, time); oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.15); osc.start(time); osc.stop(time + 0.15);
            const noise = ctx.createBufferSource(); const noiseFilter = ctx.createBiquadFilter(); const noiseGain = ctx.createGain(); noise.buffer = noiseBuffer; noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 2000; noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination); if(mixNode) noiseGain.connect(mixNode);
            noiseGain.gain.setValueAtTime(0.6, time); noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2); noise.start(time); noise.stop(time + 0.2);
        };
        const playHiHat = (ctx, time, noiseBuffer, open, mixNode) => {
            const noise = ctx.createBufferSource(); const noiseFilter = ctx.createBiquadFilter(); const noiseGain = ctx.createGain(); noise.buffer = noiseBuffer; noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 8000; noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination); if(mixNode) noiseGain.connect(mixNode);
            const decay = open ? 0.3 : 0.04; const volume = open ? 0.25 : 0.2; noiseGain.gain.setValueAtTime(volume, time); noiseGain.gain.exponentialRampToValueAtTime(0.001, time + decay); noise.start(time); noise.stop(time + decay);
        };
        const playClick = (ctx, time, accent, mixNode) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); if(mixNode) gain.connect(mixNode);
            // All clicks same frequency (800Hz) as requested
            osc.frequency.value = 800; 
            gain.gain.setValueAtTime(0.3, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1); osc.start(time); osc.stop(time + 0.1);
        };
        
        const playAlarm = () => {
             const Ctx = window.AudioContext || window.webkitAudioContext;
             const ctx = new Ctx();
             const osc = ctx.createOscillator();
             const gain = ctx.createGain();
             osc.connect(gain);
             gain.connect(ctx.destination);
             
             const now = ctx.currentTime;
             osc.type = 'square';
             osc.frequency.setValueAtTime(880, now);
             
             gain.gain.setValueAtTime(0.1, now);
             gain.gain.setValueAtTime(0, now + 0.1);
             gain.gain.setValueAtTime(0.1, now + 0.2);
             gain.gain.setValueAtTime(0, now + 0.3);
             gain.gain.setValueAtTime(0.1, now + 0.4);
             gain.gain.setValueAtTime(0, now + 0.5);
             
             osc.start(now);
             osc.stop(now + 0.6);
        };

        const PATTERNS = { 
            'click': { name: 'メトロノーム', steps: 16, data: [] }, 
            '8beat_basic': { name: '8ビート (王道)', steps: 16, data: [{t:'K',s:0}, {t:'H',s:0}, {t:'H',s:2}, {t:'S',s:4}, {t:'H',s:4}, {t:'H',s:6}, {t:'K',s:8}, {t:'H',s:8}, {t:'H',s:10}, {t:'S',s:12}, {t:'H',s:12}, {t:'H',s:14}] }, 
            '16beat_basic': { name: '16ビート (王道)', steps: 16, data: [{t:'K',s:0}, {t:'H',s:0}, {t:'H',s:1}, {t:'H',s:2}, {t:'H',s:3}, {t:'S',s:4}, {t:'H',s:4}, {t:'H',s:5}, {t:'H',s:6}, {t:'H',s:7}, {t:'K',s:8}, {t:'H',s:8}, {t:'H',s:9}, {t:'H',s:10}, {t:'H',s:11}, {t:'S',s:12}, {t:'H',s:12}, {t:'H',s:13}, {t:'H',s:14}, {t:'H',s:15}] }, 
            '4onfloor': { name: '4つ打ち', steps: 16, data: [{t:'K',s:0}, {t:'H',s:2,open:true}, {t:'K',s:4}, {t:'S',s:4}, {t:'H',s:6,open:true}, {t:'K',s:8}, {t:'H',s:10,open:true}, {t:'K',s:12}, {t:'S',s:12}, {t:'H',s:14,open:true}] }, 
            'shuffle': { name: 'シャッフル', steps: 16, swing: true, data: [{t:'K',s:0}, {t:'H',s:0}, {t:'H',s:2}, {t:'S',s:4}, {t:'H',s:4}, {t:'H',s:6}, {t:'K',s:8}, {t:'H',s:8}, {t:'H',s:10}, {t:'S',s:12}, {t:'H',s:12}, {t:'H',s:14}] },
            '3_4': { name: '3/4拍子 (ワルツ)', steps: 12, data: [{t:'K',s:0}, {t:'H',s:0}, {t:'H',s:2}, {t:'S',s:4}, {t:'H',s:4}, {t:'H',s:6}, {t:'S',s:8}, {t:'H',s:8}, {t:'H',s:10}] },
            '6_8': { name: '6/8拍子', steps: 12, data: [{t:'K',s:0}, {t:'H',s:0}, {t:'H',s:2}, {t:'H',s:4}, {t:'S',s:6}, {t:'H',s:6}, {t:'H',s:8}, {t:'H',s:10}] }
        };
        const TEMPLATES = [ { id: 'chromatic', label: '基礎：クロマチックスケール', content: 'クロマチックスケール 運指練習', duration: 10, bpm: 100 }, { id: 'c_major', label: '基礎：Cメジャースケール', content: 'Cメジャースケール 上昇・下降', duration: 15, bpm: 90 }, { id: 'chords_open', label: 'コード：オープンコード', content: 'C, G, D, Em, Am オープンコードチェンジ', duration: 20, bpm: 80 }, { id: 'chords_barre', label: 'コード：バレーコード', content: 'F, Bm バレーコード耐久', duration: 15, bpm: 0 }, { id: 'arpeggio', label: 'テクニック：アルペジオ', content: '指弾きアルペジオ パターン練習', duration: 20, bpm: 80 }, { id: 'song_practice', label: '曲練習：課題曲通し', content: '課題曲 通し練習', duration: 30, bpm: 0 } ];

        // --- Timer & Stopwatch Component ---
        const TimerStopwatch = () => {
            const [mode, setMode] = useState('stopwatch'); // 'timer' | 'stopwatch'
            const [isRunning, setIsRunning] = useState(false);
            const [time, setTime] = useState(0); 
            const [timerInput, setTimerInput] = useState(5); // Minutes
            const intervalRef = useRef(null);

            // Simplified Effect for Interval
            useEffect(() => {
                let id;
                if(isRunning) {
                    id = setInterval(() => {
                        setTime(prev => {
                            if (mode === 'timer') {
                                if (prev <= 0) {
                                    clearInterval(id);
                                    setIsRunning(false);
                                    playAlarm();
                                    return 0;
                                }
                                return prev - 100;
                            } else {
                                return prev + 100;
                            }
                        });
                    }, 100);
                }
                return () => clearInterval(id);
            }, [isRunning, mode]);

            const toggle = () => {
                if(!isRunning && mode === 'timer' && time === 0) {
                    setTime(timerInput * 60 * 1000);
                }
                setIsRunning(!isRunning);
            };

            const reset = () => {
                setIsRunning(false);
                setTime(mode === 'timer' ? timerInput * 60 * 1000 : 0);
            };
            
            useEffect(() => {
                 if (mode === 'timer' && !isRunning) {
                     setTime(timerInput * 60 * 1000);
                 }
            }, [timerInput, mode]);

            const formatTime = (ms) => {
                const totalSec = Math.ceil(ms / 1000);
                const m = Math.floor(totalSec / 60);
                const s = totalSec % 60;
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            };

            return (
                <div className="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 h-full flex flex-col">
                    <div className="flex justify-between items-center mb-4">
                        <div className="flex items-center space-x-2">
                            <IconTimer className="text-cyan-400 w-6 h-6" />
                            <h2 className="text-xl font-bold text-white">タイマー</h2>
                        </div>
                        <div className="bg-slate-700 rounded-lg p-1 flex">

            const clearLoop = () => { setLoopA(null); setLoopB(null); };
            
            const handleCanvasClick = (e) => { 
                if (!audioBuffer) return; 
                const rect = fgCanvasRef.current.getBoundingClientRect(); 
                const x = e.clientX - rect.left; 
                const newTime = (x / rect.width) * duration; 
                const wasPlaying = isPlaying;
                if(playerRef.current) { playerRef.current.stop(); if(wasPlaying) playerRef.current.start(Tone.now(), newTime); }
                setCurrentTime(newTime); 
            };

            return (
                <div className="col-span-1 md:col-span-4 bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 h-full flex flex-col justify-between">

                                </div>

                    </div>

        };

=> l.some(x => x.duration >= 60), color: 'text-amber-500' }, { id: 'd4', name: 'ロングラン', desc: '90分以上の練習', check: (l) => l.some(x => x.duration >= 90), color: 'text-amber-600' }, { id: 'd5', name: 'マラソン', desc: '120分以上の練習', check: (l) => l.some(x => x.duration >= 120), color: 'text-red-400' }, { id: 'd6', name: '耐久レース', desc: '180分以上の練習', check: (l) => l.some(x => x.duration >= 180), color: 'text-red-500' }, { id: 'h1', name: '早起き鳥', desc: '4:00-5:59開始', check: (l) => l.some(x => { const h = parseInt(x.time.split(':')[0]); return h >= 4 && h < 6; }), color: 'text-sky-400' }, { id: 'h2', name: '朝活', desc: '6:00-8:59開始', check: (l) => l.some(x => { const h = parseInt(x.time.split(':')[0]); return h >= 6 && h < 9; }), color: 'text-sky-500' }, { id: 'h3', name: 'ランチタイム', desc: '12:00-12:59開始', check: (l) => l.some(x => { const h = parseInt(x.time.split(':')[0]); return h === 12; }), color: 'text-yellow-400' }, { id: 'h4', name: '午後ティー', desc: '15:00-15:59開始', check: (l) => l.some(x => { const h = parseInt(x.time.split(':')[0]); return h === 15; }), color: 'text-orange-300' }, { id: 'h5', name: '夕暮れ', desc: '17:00-18:59開始', check: (l) => l.some(x => { const h = parseInt(x.time.split(':')[0]); return h >= 17 && h < 19; }), color: 'text-orange-500' }, { id: 'h6', name: 'プライムタイム', desc: '20:00-21:59開始', check: (l) => l.some(x => { const h = parseInt(x.time.split(':')[0]); return h >= 20 && h < 22; }), color: 'text-indigo-400' }, { id: 'h7', name: '夜更かし', desc: '23:00-0:59開始', check: (l) => l.some(x => { const h = parseInt(x.time.split(':')[0]); return h === 23 || h === 0; }), color: 'text-indigo-600' }, { id: 'h8', name: '丑三つ時', desc: '1:00-3:59開始', check: (l) => l.some(x => { const h = parseInt(x.time.split(':')[0]); return h >= 1 && h < 4; }), color: 'text-purple-700' }, { id: 'w1', name: 'ブルーマンデー', desc: '月曜日に練習', check: (l) => l.some(x => new Date(x.date).getDay() === 1), color: 'text-blue-400' }, { id: 'w2', name: '火曜サスペンス', desc: '火曜日に練習', check: (l) => l.some(x => new sc: '1日5回練習', check: (l) => { const c={}; l.forEach(x=>c[x.date]=(c[x.date]||0)+1); return Object.values(c).some(n=>n>=5); }, color: 'text-rose-500' } ];
        const hasStreak = (logs, days) => { if (logs.length < days) return false; const dates = [...new Set(logs.map(l => l.date))].sort((a,b) => new Date(b) - new Date(a)); let streak = 0; for (let i = 0; i < dates.length - 1; i++) { const diff = Math.ceil(Math.abs(new Date(dates[i]) - new Date(dates[i+1])) / (86400000)); if (diff === 1) streak++; else streak = 0; if (streak >= days - 1) return true; } return false; };
        const Stats = ({ logs }) => { const totalMinutes = logs.reduce((acc, log) => acc + parseInt(log.duration || 0), 0); const totalHours = (totalMinutes / 60).toFixed(1); const unlockedBadges = useMemo(() => ALL_BADGES.filter(b => b.check(logs, totalMinutes)), [logs, totalMinutes]); return ( <div className="col-span-1 md:col-span-2 bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 h-full"><div className="flex items-center space-x-2 mb-6"><IconAward className="text-yellow-500 w-6 h-6" /><h2 className="text-xl font-bold text-white">実績と目標</h2></div><div className="flex flex-col gap-6"><div><div className="bg-slate-700/50 p-4 rounded-lg mb-4"><h3 className="text-slate-400 text-sm mb-1">総練習時間</h3><div className="flex items-end space-x-2"><span className="text-4xl font-bold text-white">{totalHours}</span><span className="text-lg text-slate-400 mb-1">時間</span></div><div className="mt-2 text-xs text-slate-500">獲得バッジ: <span className="text-white font-bold">{unlockedBadges.length}</span> / {ALL_BADGES.length}</div></div><VisualStats logs={logs} /></div><div className="content-start flex-grow flex flex-col min-h-0"><h3 className="text-xs font-bold text-slate-400 mb-2 flex-shrink-0">獲得済みバッジ ({unlockedBadges.length})</h3><div className="flex-grow overflow-y-auto custom-scrollbar pr-2 max-h-[280px] bg-slate-900/20 rounded-lg p-1 border border-slate-700/30">{unlockedBadges.length === 0 ? ( <div className="text-slate-500 text-xs italic p-4 border border-slate-700 rounded border-dashed text-center h-full flex items-center justify-center">まだバッジがありません。<br/>練習を記録してコレクションを増やそう！</div> ) : ( <div className="grid grid-cols-2 gap-2">{unlockedBadges.map(badge => ( <div key={badge.id} className="p-2 rounded-lg border bg-slate-700/50 border-slate-600 animate-fade-in hover:bg-slate-700 transition-colors flex flex-col justify-center"><div className="flex items-center space-x-1 mb-1"><IconZap className={`w-3 h-3 ${badge.color} flex-shrink-0`} /><span className="font-bold text-xs text-white truncate">{badge.name}</span></div><p className="text-[10px] text-slate-400 leading-tight line-clamp-2">{badge.desc}</p></div> ))}</div> )}</div></div></div></div> ); };
        const PracticeLog = ({ logs, setLogs, tempAudio, setTempAudio }) => {
            const [content, setContent] = useState(''); const [bpm, setBpm] = useState('120'); const [duration, setDuration] = useState('30'); const [showTemplates, setShowTemplates] = useState(false); const recentLogs = useMemo(() => { const unique = []; const map = new Map(); for (const log of logs) { if(!map.has(log.content)) { map.set(log.content, true); unique.push(log); } if(unique.length >= 5) break; } return unique; }, [logs]); const loadTemplate = (t) => { setContent(t.content); setDuration(t.duration); setBpm(t.bpm || 120); setShowTemplates(false); }; const handleSubmit = (e) => { e.preventDefault(); if (!content.trim()) return; const newLog = { id: Date.now(), date: new Date().toLocaleDateString('ja-JP'), time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}), content, bpm, duration: parseInt(duration), audio: tempAudio }; const updatedLogs = [newLog, ...logs]; try { localStorage.setItem('guitarLogs', JSON.stringify(updatedLogs)); setLogs(updatedLogs); setContent(''); setTempAudio(null); } catch (error) { alert("保存に失敗しました"); } }; const deleteLog = (id) => { const updatedLogs = logs.filter(log => log.id !== id); setLogs(updatedLogs); localStorage.setItem('guitarLogs', JSON.stringify(updatedLogs)); }; 
            
            // Text Export for NotebookLM
            const exportTextData = () => {
                const textContent = logs.map(l => 
                    `[${l.date} ${l.time}] ${l.content} (時間:${l.duration}分 BPM:${l.bpm === '0' ? '-' : l.bpm})`
                ).join('\n');
                
                const blob = new Blob([textContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `guitar_mate_logs_text.txt`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const exportData = () => { const data = JSON.stringify(logs, null, 2); const blob = new Blob([data], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `guitar_mate_backup_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'-')}.json`; a.click(); URL.revokeObjectURL(url); }; const importData = (e) => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (e) => { try { const imported = JSON.parse(e.target.result); if(Array.isArray(imported)) { if(confirm('現在のデータを上書きして復元しますか？')) { setLogs(imported); localStorage.setItem('guitarLogs', JSON.stringify(imported)); alert('復元しました'); } } else alert('データ形式が不正です'); } catch(err) { alert('読み込み失敗'); } }; reader.readAsText(file); };
            return ( <div className="col-span-1 md:col-span-6 bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700"><div className="flex justify-between items-center mb-6"><div className="flex items-center space-x-2"><IconGuitar className="text-indigo-400 w-6 h-6" /><h2 className="text-xl font-bold text-white">練習ログ</h2></div><div className="flex gap-2"><label className="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1.5 rounded text-white flex items-center border border-slate-600 cursor-pointer" title="バックアップを復元"><IconDatabase className="w-3 h-3 mr-1"/> 復元<input type="file" accept=".json" onChange={importData} className="hidden" /></label><button onClick={exportData} className="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1.5 rounded text-white flex items-center border border-slate-600" title="データをファイルに保存(JSON)"><IconDownload className="w-3 h-3 mr-1"/> 保存</button><button onClick={exportTextData} className="text-xs bg-indigo-600 hover:bg-indigo-500 px-2 py-1.5 rounded text-white flex items-center border border-indigo-500" title="NotebookLM用にテキスト形式で保存"><IconFileText className="w-3 h-3 mr-1"/> テキスト保存</button><button onClick={() => setShowTemplates(!showTemplates)} className="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1.5 rounded text-white flex items-center border border-slate-600"><IconList className="w-3 h-3 mr-1"/> 定型</button></div></div>{showTemplates && (<div className="mb-6 p-4 bg-slate-900/80 rounded-lg border border-indigo-500/30"><h4 className="text-xs font-bold text-slate-400 mb-2">定番メニュー</h4><div className="flex flex-wrap gap-2 mb-4">{TEMPLATES.map(t => (<button key={t.id} onClick={() => loadTemplate(t)} className="text-xs bg-slate-800 hover:bg-indigo-900 border border-slate-600 px-2 py-1 rounded text-slate-300 transition-colors">{t.label}</button>))}</div>{recentLogs.length > 0 && (<><h4 className="text-xs font-bold text-slate-400 mb-2">最近の練習</h4><div className="flex flex-wrap gap-2">{recentLogs.map(l => (<button key={l.id} onClick={() => loadTemplate({content: l.content, duration: l.duration, bpm: l.bpm})} className="text-xs bg-slate-800 hover:bg-indigo-900 border border-slate-600 px-2 py-1 rounded text-slate-300 truncate max-w-[200px] transition-colors">{l.content} ({l.duration}分)</button>))}</div></>)}</div>)}<form onSubmit={handleSubmit} className="mb-8 bg-slate-900/50 p-4 rounded-lg border border-slate-700/50"><div className="grid grid-cols-1 md:grid-cols-12 gap-4 mb-4"><div className="md:col-span-6"><label className="block text-xs text-slate-400 mb-1">練習内容</label><input type="text" placeholder="例：クロマチックスケール" className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500" value={content} onChange={(e) => setContent(e.target.value)}/></div><div className="md:col-span-3"><label className="block text-xs text-slate-400 mb-1">BPM</label><select className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500" value={bpm} onChange={(e) => setBpm(e.target.value)}>{[0,60,70,80,90,100,110,120,130,140,150,160,170,180,190,200].map(opt => (<option key={opt} value={opt}>{opt === 0 ? '-' : opt}</option>))}</select></div><div className="md:col-span-3"><label className="block text-xs text-slate-400 mb-1">時間 (分)</label><select className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500" value={duration} onChange={(e) => setDuration(e.target.value)}>{[5,10,15,20,30,45,60,90,120].map(opt => (<option key={opt} value={opt}>{opt}分</option>))}</select></div></div>{tempAudio && (<div className="mb-4 bg-slate-800/80 p-3 rounded border border-rose-500/30 flex items-center justify-between"><div className="flex items-center text-rose-400 text-sm"><IconMic className="w-4 h-4 mr-2" /><span>録音データあり</span></div><div className="flex items-center gap-2"><audio src={tempAudio} controls className="w-40 h-8" /><button type="button" onClick={() => setTempAudio(null)} className="text-slate-400 hover:text-red-400"><IconX className="w-5 h-5" /></button></div></div>)}<div className="flex items-end justify-end"><button type="submit" className="w-full md:w-auto bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-2 rounded font-bold transition-colors flex items-center justify-center"><IconPlus className="w-4 h-4 mr-1" /> 記録する</button></div></form><div className="space-y-3 max-h-80 overflow-y-auto pr-2 custom-scrollbar">{logs.length === 0 && (<div className="text-center text-slate-500 py-8">まだ記録がありません。</div>)}{logs.map(log => (<div key={log.id} className="group bg-slate-700/30 hover:bg-slate-700/60 transition-colors p-4 rounded-lg flex flex-col gap-2 border border-slate-700/50"><div className="flex justify-between items-start"><div className="flex-1"><div className="flex items-center gap-2 text-xs text-slate-400 mb-1"><span>{log.date}</span><span>{log.time}</span></div><div className="flex flex-wrap items-center gap-2 mb-2"><span className="font-medium text-white">{log.content}</span>{log.bpm && log.bpm !== '0' && (<span className="px-2 py-0.5 rounded text-xs bg-slate-600 text-slate-300 flex items-center"><IconActivity className="w-3 h-3 mr-1" /> BPM {log.bpm}</span>)}</div></div><div className="flex items-center gap-2"><div className="flex items-center text-indigo-300 bg-indigo-500/10 px-3 py-1 rounded-full text-sm font-bold whitespace-nowrap"><IconClock className="w-3 h-3 mr-1" />{log.duration}min</div><button onClick={() => deleteLog(log.id)} className="text-slate-500 hover:text-red-400 transition-colors opacity-100 sm:opacity-0 sm:group-hover:opacity-100 p-2"><IconTrash className="w-4 h-4" /></button></div></div>{log.audio && (<div className="mt-2 bg-slate-800/50 p-2 rounded-lg border border-slate-700 flex items-center gap-2"><IconMusic className="w-4 h-4 text-indigo-400 shrink-0" /><audio src={log.audio} controls className="w-full h-8" /></div>)}</div>))}</div></div> );
        };

        const App = () => {
            const [logs, setLogs] = useState([]);
            const [tempAudio, setTempAudio] = useState(null);
            const audioCtxRef = useRef(null);
            const mixNodeRef = useRef(null);

            const getAudioContext = useCallback(() => {
                if (!audioCtxRef.current) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    audioCtxRef.current = new Ctx();
                    mixNodeRef.current = audioCtxRef.current.createMediaStreamDestination();
                }
                return { ctx: audioCtxRef.current, mixNode: mixNodeRef.current };
            }, []);

            useEffect(() => {
                const savedLogs = localStorage.getItem('guitarLogs');
                if (savedLogs) setLogs(JSON.parse(savedLogs));
            }, []);

            return (
                <div className="min-h-screen bg-slate-900 text-slate-200 font-sans selection:bg-amber-500/30">
                <div className="max-w-6xl mx-auto px-4 py-8">
                    <header className="mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-end border-b border-slate-800 pb-6">
                    <div><h1 className="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 mb-2">Guitar Mate</h1><p className="text-slate-400">日々の練習をサポートするパートナー</p></div>
                    <div className="mt-4 md:mt-0 text-sm text-slate-500">Keep Playing, Keep Growing.</div>
                    </header>
                    
                    <div className="grid grid-cols-1 md:grid-cols-6 gap-6 mb-6">
                        {/* Row 1: Tools */}
                        <div className="md:col-span-3 h-full"><Metronome getAudioContext={getAudioContext} /></div>
                        <div className="md:col-span-3 h-full"><TimerStopwatch /></div>
                        
                        {/* Row 2: Recorder & BackingTrack */}
                        <div className="md:col-span-2 h-full"><Recorder setTempAudio={setTempAudio} getAudioContext={getAudioContext} /></div>
                        <div className="md:col-span-4 h-full"><BackingTrack getAudioContext={getAudioContext} /></div>

                        {/* Row 3: Logs */}
                        <div className="md:col-span-6"><PracticeLog logs={logs} setLogs={setLogs} tempAudio={tempAudio} setTempAudio={setTempAudio}/></div>
                        
                        {/* Row 4: Stats */}
                        <div className="md:col-span-6"><Stats logs={logs} /></div>
                    </div>

                    <footer className="text-center text-slate-600 text-xs py-8">&copy; {new Date().getFullYear()} Guitar Mate - Your Pocket Practice Room</footer>
                </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
